description='''Dimensional Towers adds huge, themed boss towers to the world. Climb five floors of spawners, loot and decorated halls, then face a boss at the top and claim the vault.

Towers exist for the Overworld, Nether and End, plus biome variants: frozen, desert, oak forest, dark forest, jungle, swamp, taiga, badlands and pillager (with a Vindicator boss), and a piglin tower in the Nether.'''
